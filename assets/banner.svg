<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Quantum Protected Coin">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060f"/>
      <stop offset="0.55" stop-color="#0b1030"/>
      <stop offset="1" stop-color="#1a0b2e"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cf7ff"/>
      <stop offset="0.5" stop-color="#9d8cff"/>
      <stop offset="1" stop-color="#ff7ad9"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#7cf7ff"/>
      <stop offset="1" stop-color="#7cf7ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6b5cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6b5cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>

  <!-- falling bitstream (real $QUANTUM bits) -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#7cf7ff" fill-opacity="0.13">
    <text x="20" y="40">11000010100101111010110011110111010001111010101101001010010000011101010011011001110001111000110110101011011110010010011010101101</text>
    <text x="20" y="400">11111010010101101011111101011001111110000000000100100111110111100100100110000000101101100101101111100101001010011100100111100100</text>
  </g>

  <!-- atom / qubit emblem -->
  <g transform="translate(1030 210)">
    <circle r="190" fill="url(#glow)"/>
    <g fill="none" stroke-width="2.2">
      <ellipse rx="150" ry="52" stroke="#7cf7ff" stroke-opacity="0.85">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="150" ry="52" stroke="#9d8cff" stroke-opacity="0.85" transform="rotate(60)">
        <animateTransform attributeName="transform" type="rotate" from="60" to="420" dur="30s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="150" ry="52" stroke="#ff7ad9" stroke-opacity="0.85" transform="rotate(120)">
        <animateTransform attributeName="transform" type="rotate" from="120" to="480" dur="36s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <circle r="46" fill="url(#core)"/>
    <circle r="22" fill="#0b1030" stroke="#7cf7ff" stroke-width="2"/>
    <text y="7" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="20" font-weight="700" fill="#7cf7ff">|ψ⟩</text>
    <circle cx="150" cy="0" r="7" fill="#7cf7ff">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-150" cy="0" r="7" fill="#ff7ad9">
      <animateTransform attributeName="transform" type="rotate" from="120" to="480" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- text -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif">
    <text x="72" y="118" font-size="18" letter-spacing="6" fill="#9d8cff" font-weight="600">QPC-1 · SOLANA · IBM QUANTUM</text>
    <text x="70" y="196" font-size="68" font-weight="800" fill="url(#title)">Quantum Protected</text>
    <text x="70" y="270" font-size="68" font-weight="800" fill="url(#title)">Coin</text>
    <text x="72" y="320" font-size="22" fill="#c9d1ff" fill-opacity="0.85">Coins whose address is born inside a real quantum computer.</text>
    <text x="72" y="352" font-size="22" fill="#c9d1ff" fill-opacity="0.85">Committed before launch. Verifiable by anyone, forever.</text>
  </g>
</svg>
